title = "dotfiles gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "dotfiles-ssh-private-key"
description = "SSH private key material"
regex = '''-----BEGIN (OPENSSH|RSA|DSA|EC|ECDSA) PRIVATE KEY-----'''
tags = ["key", "ssh"]

[[rules]]
id = "dotfiles-env-assignment-secret"
description = "Likely secret assigned in an env-style line"
regex = '''(?im)^[\t ]*(?:export[\t ]+)?(?:api[_-]?key|token|secret|password|passwd|credential)[\t ]*=[\t ]*['\"]?[A-Za-z0-9_./+=:-]{20,}['\"]?[\t ]*(?:#.*)?$'''
tags = ["secret", "env"]

[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "Documented keyboard shortcut, not an API key"
condition = "AND"
regexTarget = "secret"
regexes = ['''^ctrl\+shift\+down$''']
paths = [
  '''^home/AppData/Local/(?:Packages/Microsoft\.WindowsTerminal_8wekyb3d8bbwe/LocalState/settings\.json\.tmpl|Microsoft/Windows Terminal/Fragments/dotfiles/settings\.json)$''',
  '''^home/AppData/Roaming/Code/User/keybindings\.json\.tmpl$'''
]

# Exact placeholder values only; never exclude entire files or variable names.
[allowlist]
description = "Explicit redacted placeholder"
regexTarget = "secret"
regexes = ['''^MAESTRO_REDACTED$''']
