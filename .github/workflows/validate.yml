name: Validate

on:
  push:
    branches: [main, master, 'feature/**']
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, regression tests, and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install check tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          bash .github/scripts/install-ci-tool.sh gitleaks "$RUNNER_TEMP/bin"
          bash .github/scripts/install-ci-tool.sh actionlint "$RUNNER_TEMP/bin"
          bash .github/scripts/install-ci-tool.sh chezmoi "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: make test check-links
      - run: actionlint
      - name: Windows installer regression tests
        shell: pwsh
        run: ./.github/tests/windows-installer.ps1

  check-secrets:
    name: Scan Git history for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: bash .github/scripts/install-ci-tool.sh gitleaks "$RUNNER_TEMP/bin"
      - run: '"$RUNNER_TEMP/bin/gitleaks" git --redact --config .gitleaks.toml'

  discord-notify:
    name: Discord Notification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [checks, check-secrets]
    if: ${{ always() && !cancelled() }}
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          JOB_RESULTS: ${{ toJSON(needs) }}
        with:
          script: |
            const webhook = process.env.DISCORD_WEBHOOK;
            if (!webhook) { core.info('Discord webhook not configured'); return; }
            const jobs = Object.entries(JSON.parse(process.env.JOB_RESULTS));
            const passed = jobs.every(([, job]) => job.result === 'success');
            const pr = context.payload.pull_request;
            const description = jobs.map(([name, job]) => `${name}: ${job.result}`).join('\n')
              + (pr ? `\nPR #${pr.number}: ${pr.title}` : '');
            const response = await fetch(webhook, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ allowed_mentions: { parse: [] }, embeds: [{
                title: `Validation ${passed ? 'PASSED' : 'FAILED'}`,
                description: description.slice(0, 4096),
                color: passed ? 3066993 : 15158332,
                fields: [{ name: 'Ref', value: context.ref.slice(0, 1024) }],
                url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              }] }),
              signal: AbortSignal.timeout(15000)
            });
            if (!response.ok) throw new Error(`Discord returned HTTP ${response.status}`);
