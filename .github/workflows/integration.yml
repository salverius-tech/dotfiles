name: Integration Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 0 * * 0' # Weekly upstream installation smoke test
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployment:
    name: Deploy configs (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned chezmoi
        run: |
          bash .github/scripts/install-ci-tool.sh chezmoi "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Deploy twice and validate rendered configuration
        run: bash .github/scripts/validate-templates.sh --deploy
      - name: Test installer failure handling without installing packages
        shell: pwsh
        run: ./.github/tests/windows-installer.ps1
      - name: Test installer compatibility with Windows PowerShell 5.1
        if: ${{ runner.os == 'Windows' }}
        shell: powershell
        run: ./.github/tests/windows-installer.ps1

  upstream-install:
    name: Upstream Linux installation smoke test
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install from upstream in disposable container
        run: docker build --file .github/tests/Dockerfile.install --tag dotfiles-install-test .

  discord-notify:
    name: Discord Notification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [deployment, upstream-install]
    if: ${{ always() && !cancelled() }}
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          JOB_RESULTS: ${{ toJSON(needs) }}
        with:
          script: |
            const webhook = process.env.DISCORD_WEBHOOK;
            if (!webhook) { core.info('Discord webhook not configured'); return; }
            const jobs = Object.entries(JSON.parse(process.env.JOB_RESULTS));
            const passed = jobs.every(([name, job]) => job.result === 'success'
              || (name === 'upstream-install' && job.result === 'skipped'
                && !['schedule', 'workflow_dispatch'].includes(context.eventName)));
            const response = await fetch(webhook, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ allowed_mentions: { parse: [] }, embeds: [{
                title: `Integration ${passed ? 'PASSED' : 'FAILED'}`,
                description: jobs.map(([name, job]) => `${name}: ${job.result}`).join('\n'),
                color: passed ? 3066993 : 15158332,
                fields: [{ name: 'Ref', value: context.ref.slice(0, 1024) }],
                url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              }] }),
              signal: AbortSignal.timeout(15000)
            });
            if (!response.ok) throw new Error(`Discord returned HTTP ${response.status}`);
